<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Poppins:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Fraunces:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@500&family=Allura&family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Bodoni+Moda:wght@500&display=swap">
<link rel="stylesheet" href="assets.css">
<script src="/reviewshot/templates.js"></script>
<script src="/reviewshot/templates-more.js"></script>
<script src="assets.js" defer></script>
<title>screenshot-1-hero</title>
</head>
<body>

<div class="glow" style="right:-120px;top:40px"></div>
<div class="frame">
  <div class="copy">
    <img class="logo" src="/reviewshot/assets/logo.png" alt="">
    <h1>Turn 5-star reviews into <em>scroll-stopping</em> posts</h1>
    <p class="sub">Pick a review, pick a design, download. Your happiest customers become your best marketing.</p>
    <span class="pill">✦ One click from Google &amp; Trustpilot</span>
  </div>
  <div class="stage">
    <canvas class="post" data-design="testimonial" data-sample="1" data-brand="garden" style="position:absolute;width:300px;left:30px;top:250px;transform:rotate(-7deg)"></canvas>
    <canvas class="post" data-design="glass" data-sample="0" data-brand="reviewpost" style="position:absolute;width:300px;right:20px;top:230px;transform:rotate(7deg)"></canvas>
    <canvas class="post" data-design="spotlight" data-sample="0" data-brand="reviewpost" style="position:relative;width:380px;z-index:2"></canvas>
  </div>
</div>
</body>
</html>
