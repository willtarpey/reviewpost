<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Poppins:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Fraunces:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@500&family=Allura&family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Bodoni+Moda:wght@500&display=swap">
<link rel="stylesheet" href="assets.css">
<script src="/reviewshot/templates.js"></script>
<script src="/reviewshot/templates-more.js"></script>
<script src="assets.js" defer></script>
<title>screenshot-4-designs</title>
</head>
<body>

<style>
  .grid { display: grid; grid-template-columns: repeat(3, 200px); gap: 18px 20px; }
  figure { margin: 0; }
  figure canvas { width: 200px; border-radius: 8px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }
  figcaption { margin-top: 7px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
  figcaption span { font-size: 9px; letter-spacing: .08em; background: #eefca6; color: #16170f; border-radius: 999px; padding: 2px 6px; }
</style>
<div class="frame">
  <div class="copy">
    <img class="logo" src="/reviewshot/assets/logo.png" alt="">
    <h1>21 designs for <em>every feed</em></h1>
    <p class="sub">From clean and minimal to neon, tickets and polaroids. Every design works as an Instagram post, a Story and a LinkedIn post.</p>
    <span class="pill">3 free · 18 Pro · more on the way</span>
  </div>
  <div class="stage"><div class="grid"><figure><canvas class="post" data-design="spotlight" data-sample="0" data-brand="reviewpost"></canvas><figcaption>Spotlight</figcaption></figure><figure><canvas class="post" data-design="card" data-sample="1" data-brand="garden"></canvas><figcaption>Card</figcaption></figure><figure><canvas class="post" data-design="bold" data-sample="2" data-brand="salon"></canvas><figcaption>Bold</figcaption></figure><figure><canvas class="post" data-design="editorial" data-sample="0" data-brand="garden"></canvas><figcaption>Editorial <span>PRO</span></figcaption></figure><figure><canvas class="post" data-design="poster" data-sample="1" data-brand="reviewpost"></canvas><figcaption>Poster <span>PRO</span></figcaption></figure><figure><canvas class="post" data-design="neon" data-sample="2" data-brand="salon"></canvas><figcaption>Neon <span>PRO</span></figcaption></figure><figure><canvas class="post" data-design="ticket" data-sample="0" data-brand="bakery"></canvas><figcaption>Ticket <span>PRO</span></figcaption></figure><figure><canvas class="post" data-design="testimonial" data-sample="1" data-brand="garden"></canvas><figcaption>Testimonial <span>PRO</span></figcaption></figure><figure><canvas class="post" data-design="marker" data-sample="2" data-brand="reviewpost"></canvas><figcaption>Marker <span>PRO</span></figcaption></figure></div></div>
</div>
</body>
</html>
