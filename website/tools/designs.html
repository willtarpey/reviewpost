async function renderAll(set) {
  const fams = ['Space Grotesk', 'Inter', 'Plus Jakarta Sans', 'Poppins', 'Fraunces', 'Playfair Display', 'DM Sans'];
  await Promise.all([...fams.flatMap((f) => ['500', '600', '700', '800'].map((w) => document.fonts.load(`${w} 32px "${f}"`))), ...DISPLAY_LOADS.map((f) => document.fonts.load(f)), document.fonts.load('italic 600 32px "Playfair Display"')]);
  const out = {};
  const list = set === 'options' ? OPTIONS.map(([f, d, b, rv, ph]) => [f, d, b, 'post', rv, ph]) : JOBS;
  for (const [file, design, b, size, rv, photo] of list) {
    const { w, h } = SIZES[size];
    const bg = photo ? await loadImg(photo) : null;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const brand = BRANDS[b], r = REVIEWS[rv || b] || REVIEWS.coffee;

    const sx = s.getContext('2d'); sx.imageSmoothingQuality = 'high'; sx.drawImage(c, 0, 0, s.width, s.height);
    out[file] = s.toDataURL('image/webp', 0.88);
  }
  return out;
