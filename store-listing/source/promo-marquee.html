<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Poppins:wght@500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Fraunces:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@500&family=Allura&family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Bodoni+Moda:wght@500&display=swap">
<link rel="stylesheet" href="assets.css">
<script src="/reviewshot/templates.js"></script>
<script src="/reviewshot/templates-more.js"></script>
<script src="assets.js" defer></script>
<title>promo-marquee</title>
</head>
<body>

<style>
  body { width: 1400px; height: 560px; }
  .frame { grid-template-columns: 520px 1fr; padding: 0 80px; }
  h1 { font-size: 58px; }
</style>
<div class="glow" style="right:80px;top:-120px"></div>
<div class="frame">
  <div class="copy">
    <img class="logo" src="/reviewshot/assets/logo.png" alt="">
    <h1>Turn 5-star reviews into <em>scroll-stopping</em> posts</h1>
    <p class="sub">One click from Google &amp; Trustpilot. Your brand, every post.</p>
  </div>
  <div class="stage">
    <canvas class="post" data-design="editorial" data-sample="0" data-brand="garden" style="position:absolute;width:250px;left:20px;top:150px;transform:rotate(-8deg)"></canvas>
    <canvas class="post" data-design="luxe" data-sample="1" data-brand="bakery" style="position:absolute;width:250px;right:10px;top:140px;transform:rotate(8deg)"></canvas>
    <canvas class="post" data-design="glass" data-sample="0" data-brand="reviewpost" style="position:relative;width:310px;z-index:2"></canvas>
  </div>
</div>
</body>
</html>
